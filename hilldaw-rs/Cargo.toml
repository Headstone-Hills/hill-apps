[workspace]
members = ["usb", "core", "device", "drums", "app", "sp", "tools-bin"]
# plain `cargo test` skips the SDL program so it needs no SDL installed; build it with `-p hilldaw`
default-members = ["usb", "core", "device", "drums", "app", "tools-bin"]
resolver = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
