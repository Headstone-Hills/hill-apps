[package]
name = "hilldaw-tools"
version = "0.1.0"
edition = "2021"
description = "Hardware-in-the-loop tools: record to disk and measure MIDI-to-audio latency."

[dependencies]
hilldaw-usb = { path = "../usb" }
hilldaw-core = { path = "../core" }
hilldaw-device = { path = "../device" }
hilldaw-drums = { path = "../drums" }

[[bin]]
name = "hdtool"
path = "src/main.rs"
